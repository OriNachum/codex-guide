name: Codex Docs Autofix

on:
  workflow_run:
    workflows:
      - Docs Validation
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: codex-docs-autofix-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

jobs:
  autofix:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest

    steps:
      - name: Check out failed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2

      - name: Verify OpenAI API key is configured
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY secret is required for Codex Docs Autofix." >&2
            exit 1
          fi

      - name: Build Codex prompt
        env:
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
          FAILED_RUN_URL: ${{ github.event.workflow_run.html_url }}
          FAILED_BRANCH: ${{ github.event.workflow_run.head_branch }}
          FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          cp .github/prompts/codex-docs-autofix.md /tmp/codex-docs-autofix.md
          {
            echo
            echo "Failure context:"
            echo "- Docs Validation run ID: ${FAILED_RUN_ID}"
            echo "- Docs Validation URL: ${FAILED_RUN_URL}"
            echo "- Failed branch: ${FAILED_BRANCH}"
            echo "- Failed commit: ${FAILED_SHA}"
          } >> /tmp/codex-docs-autofix.md

      - name: Run Codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: /tmp/codex-docs-autofix.md
          sandbox: workspace-write

      - name: Run markdownlint-cli2
        run: markdownlint-cli2 "**/*.md"

      - name: Run docs validation
        run: python3 scripts/validate-docs.py

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: codex/docs-validation-auto-fix
          base: ${{ github.event.repository.default_branch }}
          title: "fix(ci): auto-fix docs validation failure"
          commit-message: "fix(ci): auto-fix docs validation failure"
          body: |
            Auto-generated by `Codex Docs Autofix`.

            Source workflow: `${{ github.event.workflow_run.name }}`
            Failed run: ${{ github.event.workflow_run.html_url }}
