name: Docs Freshness Audit

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  docs-freshness:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2

      - name: Ensure OPENAI_API_KEY is configured
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY secret is required for Docs Freshness Audit." >&2
            exit 1
          fi

      - name: Ensure docs-freshness label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create docs-freshness --description "Factual Codex docs audit" --color "0e8a16" 2>/dev/null || true

      - name: Run Codex freshness audit
        uses: openai/codex-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/prompts/codex-docs-freshness.md
          sandbox: workspace-write

      - name: Run markdownlint-cli2
        run: markdownlint-cli2 "**/*.md"

      - name: Run docs validation
        run: python3 scripts/validate-docs.py

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - name: Create pull request when repo changed
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: codex/docs-freshness
          base: ${{ github.event.repository.default_branch }}
          title: "docs: refresh Codex references"
          commit-message: "docs: refresh Codex references"
          body: |
            Auto-generated by `Docs Freshness Audit`.

            This PR contains factual updates to `skills/codex-guide-ask/references/`
            based on the configured official OpenAI Codex sources.
